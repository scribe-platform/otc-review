title: Watch the Graphics V1 Guide and answer the open questions
detail: >-
  The 3-minute overview shows one job going from estimate to paid invoice,
  and the cards below it break each part into short videos and pictures.
  Twelve items are marked with a blue question — those are the decisions
  we can't make for you, covering things like card payments, the QuickBooks
  connection, sales tax, and what a technician is allowed to see. Answering
  those is what unblocks the build.
